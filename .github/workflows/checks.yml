name: Tests and installation

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/check_installed.py', 'pyproject.toml', '.github/workflows/checks.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/check_installed.py', 'pyproject.toml', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '2.2.6'
          - python: '3.12.14'
            numpy: '2.3.5'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test and build dependencies
        run: python -m pip install pandas==2.2.3 numpy==${{ matrix.numpy }} setuptools==80.9.0 wheel==0.45.1 build==1.3.0
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Verify wheel in an isolated virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/seasonlens-installed"
          "$RUNNER_TEMP/seasonlens-installed/bin/python" -m pip install numpy==${{ matrix.numpy }} dist/*.whl
          version=$(python -c "from importlib.metadata import PathDistribution; from pathlib import Path; print(PathDistribution(next(Path('src').glob('*.egg-info'))).version)")
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/seasonlens-installed/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed.py" --expected-version "$version"
