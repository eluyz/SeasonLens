name: Build public demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-public-demo.yml'
      - 'examples/explorer_demo.py'
      - 'examples/build_pages.py'
      - 'examples/responsive_check.html'
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: write

concurrency:
  group: public-demo-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install reproducible build dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.3.5
      - name: Run analytical checks
        run: python -m unittest discover -s tests -q
      - name: Generate invented sample pages
        run: |
          python examples/explorer_demo.py
          python examples/build_pages.py
      - name: Verify sample provenance, browser assets and JavaScript syntax
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          expected = {'SYNTHETIC_GRAIN', 'SYNTHETIC_CORN', 'SYNTHETIC_RAPESEED', 'EUR_PLN', 'EUR_USD', 'USD_PLN'}
          for path in ('docs/index.html', 'examples/explorer_demo.html'):
              html = Path(path).read_text(encoding='utf-8')
              data = json.loads(re.search(r'<script id="dataset" type="application/json">(.*?)</script>', html, re.S)[1])
              assert set(data) == expected, path
              assert all(entry['source'] == 'SYNTHETIC' for entry in data.values()), path
              assert sum(len(entry['views']) for entry in data.values()) == 9, path
              assert all(view['daily'] for entry in data.values() for view in entry['views'].values()), path
              assert all('market' in view and view.get('as_of') == '2026-10-06' for entry in data.values() for view in entry['views'].values()), path
              scripts = re.findall(r'<script(?: id="xlsx-reader")?>(.*?)</script>', html, re.S)
              app_scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              assert scripts and all('@@' not in script for script in scripts), path
              for script in scripts:
                  subprocess.run(['node', '--check'], input=script, text=True, check=True)
              if path == 'docs/index.html':
                  assert 'id="browser-upload"' in html and 'id="upload"' not in html
                  assert all(marker not in ''.join(app_scripts) for marker in ('fetch(', 'XMLHttpRequest', 'sendBeacon', 'WebSocket', 'indexedDB'))
                  assert ''.join(app_scripts).count('global.localStorage') == 1
                  assert all('localStorage' not in Path('src/seasonlens/'+name).read_text() for name in ('browser_import.js','workbook_import.js','workbook_ui.js','private_import.js','market_ui.js','science_common.js','risk_analysis.js','seasonal_stats.js','forecast_lab.js','fundamentals.js','scientific_ui.js','quick_controls.js','report_export.js'))
                  assert 'id="scientific-analysis"' in html
                  assert 'id="report-export-panel"' in html and 'initSeasonLensQuickControls' in html
                  assert 'id="seasonlens-start"' in html and 'initSeasonLensStartGuide' in html
                  assert 'id="language-en"' in html and 'id="language-pl"' in html and 'SeasonLensLocale.init();' in html
                  assert all('id="science-'+name+'-panel"' in html for name in ('risk','seasonal','fx','forecast','fundamental'))
                  import hashlib
                  assert hashlib.sha256(Path('src/seasonlens/vendor/xlsx.mini.min.js').read_bytes()).hexdigest() == '0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939'
          print('Both pages contain exactly six invented instruments and nine views.')
          import base64
          assert Path('docs/seasonlens-import-template.xlsx').read_bytes() == base64.b64decode(Path('src/seasonlens/import_template.xlsx.b64').read_text().strip(), validate=True)
          assert Path('docs/layout-check.html').read_bytes() == Path('examples/responsive_check.html').read_bytes()
          PY
      - name: Save generated files on a candidate branch
        run: |
          if git diff --quiet -- docs/index.html docs/.nojekyll docs/sample_prices.csv examples/explorer_demo.html && test -f docs/seasonlens-import-template.xlsx && git ls-files --error-unmatch docs/seasonlens-import-template.xlsx docs/layout-check.html >/dev/null 2>&1 && git diff --quiet -- docs/seasonlens-import-template.xlsx docs/layout-check.html; then
            echo 'Generated files already match the committed source.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          candidate="automation/public-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$candidate"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/index.html docs/.nojekyll docs/sample_prices.csv docs/seasonlens-import-template.xlsx docs/layout-check.html examples/explorer_demo.html
          git commit -m 'Regenerate public demo from six invented instruments'
          git push origin "HEAD:refs/heads/$candidate"
          printf 'Candidate branch: `%s`\n\nGenerated commit: `%s`\n\nPromote this commit with a checked fast-forward through the authorized GitHub connection to trigger Pages. This workflow does not update main or deploy the site.\n' "$candidate" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
